:"אני אוהב כשהחברים שלי בסביבה.","family_members":[]},{"serial":291,"en":"disease","pos":"Noun","mean_he":"מחלה","synonyms":[],"ex_en":"This disease spreads through the air.","ex_he":"המחלה הזאת מתפשטת באוויר.","family_members":[]},{"serial":112,"en":"Bible","pos":"Noun","mean_he":"התנ״ך; כתבי הקודש","synonyms":[],"ex_en":"The boy reads the Bible at home.","ex_he":"דן קורא בתנ״ך בבית.","family_members":[]},{"serial":289,"en":"discover","pos":"Verb","mean_he":"לגלות","synonyms":[],"ex_en":"They were not able to discover any secrets.","ex_he":"הם לא הצליחו לגלות שום סודות.","family_members":[{"word":"discovery","pos":"noun"}]},{"serial":506,"en":"inform","pos":"Verb","mean_he":"ליידע","synonyms":[],"ex_en":"Please inform us about the change.","ex_he":"אנא הודע לנו על השינוי.","family_members":[{"word":"information","pos":"noun"}]},{"serial":296,"en":"drawer","pos":"Noun","mean_he":"מגירה","synonyms":[],"ex_en":"The top desk drawer is open.","ex_he":"המגירה העליונה בשולחן פתוחה.","family_members":[]},{"serial":1039,"en":"virus","pos":"Noun","mean_he":"נגיף; וירוס מחשב","synonyms":["organism, disease","computing problem"],"ex_en":"It is probably a virus.","ex_he":"זה כנראה נגיף.","family_members":[]},{"serial":463,"en":"however","pos":"Adverb","mean_he":"עם זאת","synonyms":["nevertheless"],"ex_en":"It was cold. However, we went out.","ex_he":"היה קר. עם זאת, יצאנו.","family_members":[]},{"serial":515,"en":"international","pos":"Adjective","mean_he":"בין־לאומי","synonyms":[],"ex_en":"Spanish is an international language.","ex_he":"ספרדית היא שפה בינלאומית.","family_members":[{"word":"internationally","pos":"adverb"}]},{"serial":75,"en":"back","pos":"Adjective","mean_he":"אחורי","synonyms":["at or near back of something"],"ex_en":"The back door is open.","ex_he":"הדלת האחורית פתוחה.","family_members":[]},{"serial":408,"en":"go back","pos":"Phrasal verb","mean_he":"לחזור","synonyms":[],"ex_en":"I had to go back to school.","ex_he":"נאלצתי לחזור לבית הספר.","family_members":[]},{"serial":156,"en":"care","pos":"Noun","mean_he":"טיפול; תשומת לב","synonyms":["attention"],"ex_en":"The patient needs daily care.","ex_he":"החולה זקוק לטיפול יומיומי.","family_members":[{"word":"care","pos":"verb"},{"word":"careful","pos":"adjective"},{"word":"carefully","pos":"adverb"}]},{"serial":17,"en":"adjective","pos":"Noun","mean_he":"שם תואר","synonyms":[],"ex_en":"“Blue” is an adjective.","ex_he":"המילה “blue” היא שם תואר.","family_members":[{"word":"adjectival","pos":"adjective"}]},{"serial":787,"en":"read something out","pos":"Phrasal verb","mean_he":"להקריא משהו בקול","synonyms":[],"ex_en":"She read the poem out to the class.","ex_he":"היא הקריאה את השיר לכיתה.","family_members":[]},{"serial":265,"en":"demand","pos":"Verb","mean_he":"לדרוש","synonyms":[],"ex_en":"Customers demand better service.","ex_he":"לקוחות דורשים שירות טוב יותר.","family_members":[{"word":"demand","pos":"noun"}]},{"serial":968,"en":"then","pos":"Adverb","mean_he":"אז; כתוצאה מכך","synonyms":["so that, result"],"ex_en":"Finish your work, then go home.","ex_he":"סיים את העבודה ואז לך הביתה.","family_members":[]},{"serial":309,"en":"Earth","pos":"Noun","mean_he":"אדמה; כדור הארץ","synonyms":[],"ex_en":"Earth moves around the sun.","ex_he":"כדור הארץ נע סביב השמש.","family_members":[]},{"serial":131,"en":"break down","pos":"Phrasal verb","mean_he":"להתקלקל","synonyms":[],"ex_en":"Our school bus broke down.","ex_he":"אוטובוס בית הספר שלנו התקלקל.","family_members":[]},{"serial":617,"en":"meet","pos":"Verb","mean_he":"להכיר; לפגוש","synonyms":["introduce"],"ex_en":"I would like to meet the new teacher.","ex_he":"הייתי רוצה לפגוש את המורה החדש.","family_members":[]},{"serial":454,"en":"highway","pos":"Noun","mean_he":"כביש מהיר","synonyms":[],"ex_en":"The highway runs beside the river.","ex_he":"הכביש המהיר עובר לצד הנהר.","family_members":[]},{"serial":223,"en":"contents","pos":"Noun","mean_he":"תכולה; תוכן","synonyms":[],"ex_en":"May I see the full contents of the package?","ex_he":"אפשר לראות את כל תכולת החבילה?","family_members":[]},{"serial":55,"en":"around","pos":"Preposition","mean_he":"בסביבה; מסביב","synonyms":["nearby"],"ex_en":"We walked around the lake.","ex_he":"הלכנו מסביב לאגם.","family_members":[]},{"serial":196,"en":"circus","pos":"Noun","mean_he":"קרקס","synonyms":[],"ex_en":"The circus is in town.","ex_he":"הקרקס הגיע לעיר.","family_members":[]},{"serial":584,"en":"look like","pos":"Phrase","mean_he":"להיראות כמו","synonyms":[],"ex_en":"Did he really look like a doctor?","ex_he":"האם באמת הוא נראָה כמו רופא?","family_members":[]},{"serial":722,"en":"physics","pos":"Noun","mean_he":"פיזיקה","synonyms":[],"ex_en":"We study physics at school.","ex_he":"אנחנו לומדים פיזיקה בבית הספר.","family_members":[]},{"serial":1033,"en":"until","pos":"Conjunction","mean_he":"עד ש־","synonyms":["continuing to happen"],"ex_en":"Please wait here until we get back.","ex_he":"בבקשה, תמתין פה עד שנשוב.","family_members":[]},{"serial":140,"en":"by mistake","pos":"Phrase","mean_he":"בטעות","synonyms":[],"ex_en":"I took the wrong umbrella by mistake.","ex_he":"לקחתי בטעות את המטרייה הלא נכונה.","family_members":[]},{"serial":1076,"en":"wool","pos":"Noun","mean_he":"צמר","synonyms":[],"ex_en":"Sheep give us wool.","ex_he":"כבשים נותנות לנו צמר.","family_members":[]},{"serial":133,"en":"bring something back","pos":"Phrasal verb","mean_he":"להחזיר משהו","synonyms":[],"ex_en":"Please bring back some food.","ex_he":"החזר בבקשה מעט אוכל.","family_members":[]},{"serial":262,"en":"degree","pos":"Noun","mean_he":"מידה; דרגה; תואר","synonyms":["temperature"],"ex_en":"I agree to some degree.","ex_he":"אני מסכים במידה מסוימת.","family_members":[]},{"serial":636,"en":"murder","pos":"Noun","mean_he":"רצח","synonyms":[],"ex_en":"The police are investigating a murder.","ex_he":"המשטרה חוקרת מקרה רצח.","family_members":[{"word":"murder","pos":"verb"},{"word":"murderer","pos":"noun"}]},{"serial":1090,"en":"yourselves","pos":"Pronoun","mean_he":"את עצמכם; את עצמכן","s
