":"Noun","mean_he":"סוללה","synonyms":[],"ex_en":"Our battery is dead.","ex_he":"הסוללה שלנו התרוקנה.","family_members":[]},{"serial":1082,"en":"would love to (do something)","pos":"Phrase","mean_he":"אשמח (לעשות משהו)","synonyms":[],"ex_en":"I would love to see it too.","ex_he":"גם אשמח לראות את זה.","family_members":[]},{"serial":925,"en":"suppose","pos":"Verb","mean_he":"להניח","synonyms":[],"ex_en":"What exactly do you suppose happened there?","ex_he":"מה בדיוק לדעתך קרה שם?","family_members":[{"word":"I suppose","pos":""}]},{"serial":797,"en":"record","pos":"Noun","mean_he":"רשומה; תיעוד; שיא","synonyms":["sounds, pictures"],"ex_en":"That is likely a new record.","ex_he":"זה כנראה שיא חדש.","family_members":[{"word":"recording","pos":"Noun"}]},{"serial":1088,"en":"big brother","pos":"Phrase","mean_he":"אח גדול","synonyms":[],"ex_en":"My big brother helps me.","ex_he":"אחי הגדול עוזר לי.","family_members":[]},{"serial":57,"en":"arrival","pos":"Noun","mean_he":"הגעה","synonyms":[],"ex_en":"Prior to your arrival, he left for Paris.","ex_he":"לפני הגעתך, הוא יצא לפריז.","family_members":[]},{"serial":317,"en":"employ","pos":"Verb","mean_he":"להעסיק","synonyms":[],"ex_en":"Are they really going to employ more people?","ex_he":"באמת הם מתכוננים להעסיק אנשים נוספים?","family_members":[{"word":"employee (Noun); employer","pos":"Noun"}]},{"serial":690,"en":"order","pos":"Noun","mean_he":"הזמנה","synonyms":["arrangement"],"ex_en":"Your lunch order is ready.","ex_he":"ההזמנה שלך לארוחת הצהריים מוכנה.","family_members":[]},{"serial":264,"en":"delay","pos":"Verb","mean_he":"לעכב","synonyms":[],"ex_en":"Possibly, the accident will delay his arrival too.","ex_he":"גם יתכן שהתאונה תעכב את הגעתו.","family_members":[]},{"serial":153,"en":"cap","pos":"Noun","mean_he":"כובע","synonyms":[],"ex_en":"Does this really cap belong to you?","ex_he":"באמת הכובע הזה שייך לך?","family_members":[]},{"serial":864,"en":"silly","pos":"Adjective","mean_he":"טיפש","synonyms":[],"ex_en":"That is silly.","ex_he":"זה טיפשי.","family_members":[]},{"serial":819,"en":"round","pos":"Adverb","mean_he":"עגול","synonyms":["circle/circular movement","to several places"],"ex_en":"It was round too.","ex_he":"גם זה היה עגול.","family_members":[]},{"serial":619,"en":"midday","pos":"Noun","mean_he":"צהריים","synonyms":[],"ex_en":"We eat lunch at midday.","ex_he":"אנחנו אוכלים ארוחת צהריים בצהריים.","family_members":[]},{"serial":947,"en":"terrible","pos":"Adjective","mean_he":"נורא","synonyms":["bad, unpleasant"],"ex_en":"The weather is terrible tomorrow.","ex_he":"מזג האוויר נורא מחר.","family_members":[{"word":"terribly","pos":"Adverb"}]},{"serial":522,"en":"it depends","pos":"Idiom","mean_he":"זה תלוי","synonyms":[],"ex_en":"It depends on the weather.","ex_he":"זה תלוי במזג האוויר.","family_members":[]},{"serial":355,"en":"fear","pos":"Noun","mean_he":"פחד","synonyms":["bad feeling"],"ex_en":"This boy showed no fear.","ex_he":"הנער לא הפגין פחד.","family_members":[]},{"serial":248,"en":"crossing","pos":"Noun","mean_he":"מעבר","synonyms":["where people cross"],"ex_en":"Please look at the train crossing the bridge.","ex_he":"בבקשה, הבט ברכבת חוצה את הגשר.","family_members":[]},{"serial":353,"en":"fantastic","pos":"Adjective","mean_he":"פנטסטי","synonyms":[],"ex_en":"It was quite fantastic too.","ex_he":"גם זה היה די פנטסטי.","family_members":[]},{"serial":26,"en":"affect","pos":"Verb","mean_he":"להשפיע","synonyms":["cause emotion"],"ex_en":"It might affect our friendship too.","ex_he":"גם זה עלול להשפיע על הידידות שלנו.","family_members":[]},{"serial":499,"en":"in the end","pos":"Phrase","mean_he":"בסופו של דבר","synonyms":[],"ex_en":"In the end, they approved the proposal too.","ex_he":"גם סוף סוף הם קיבלו את ההצעה.","family_members":[]},{"serial":281,"en":"digital","pos":"Adjective","mean_he":"דיגיטלי","synonyms":[],"ex_en":"This is a digital camera.","ex_he":"זאת מצלמה דיגיטלית.","family_members":[]},{"serial":21,"en":"advantage","pos":"Noun","mean_he":"יתרון","synonyms":[],"ex_en":"We have an advantage too.","ex_he":"גם לנו יש יתרון.","family_members":[]},{"serial":1013,"en":"traveler","pos":"Noun","mean_he":"מטייל","synonyms":[],"ex_en":"Our traveler reached his destination at last.","ex_he":"הנוסע שלנו הגיע ליעדו לבסוף.","family_members":[{"word":"travel","pos":"Noun"}]},{"serial":917,"en":"style","pos":"Noun","mean_he":"סִגְנוֹן; אָפְנָה; סְטַיְל","synonyms":["fashion"],"ex_en":"It is my style.","ex_he":"זה הסגנון שלי.","family_members":[]},{"serial":669,"en":"off","pos":"Adverb","mean_he":"הנחה; כבוי","synonyms":["removed, distant"],"ex_en":"Can I turn off the television?","ex_he":"אני יכול לכבות את הטלוויזיה?","family_members":[]},{"serial":315,"en":"email","pos":"Noun","mean_he":"מייל","synonyms":[],"ex_en":"That is my email address.","ex_he":"זו כתובת המייל שלי.","family_members":[]},{"serial":827,"en":"scarf","pos":"Noun","mean_he":"צעיף","synonyms":[],"ex_en":"Put your scarf on. it is cold out.","ex_he":"שים את הצעיף. קר בחוץ.","family_members":[{"word":"headscarf","pos":""}]},{"serial":346,"en":"fair","pos":"Adjective","mean_he":"הוגן","synonyms":["reasonable"],"ex_en":"It would not be fair to you.","ex_he":"זה לא יהיה הוגן כלפיך.","family_members":[]},{"serial":754,"en":"proposal","pos":"Noun","mean_he":"הצעה","synonyms":[],"ex_en":"I agreed to the proposal too.","ex_he":"גם הסכמתי להצעה.","family_members":[]},{"serial":36,"en":"aloud","pos":"Adverb","mean_he":"בקול רם","synonyms":[],"ex_en":"Please read the book aloud.","ex_he":"בבקשה, קרא את הספר בקול רם.","family_members":[]},{"serial":1015,"en":"trouble","pos":"Noun","mean_he":"צרה","synonyms":["problem, difficulty"],"ex_en":"Did you really have any trouble?","ex_he":"באמת היתה לך איזו בעיה שהיא?","family_members":[]},{"serial":844,"en":"set","pos":"Verb","mean_he":"הִנִּיחַ; שָׂם; קִבֵּעַ","synonyms":["put something somwhere, get ready"],"ex_en":"The boy set his drink down.","ex_he":"דן הניח את כוסית המשקה שלו.","family_members":[]},{"serial":574,"en":"limit","pos":"Noun","mean_he":"גבול","synonyms":[],"ex_en":"There is a limit to everything too.","ex_he":"גם יש גבול לכל דבר.","family_members":[]},{"serial":687,"en":"opportunity","pos":"Noun","mean_he":"הזדמנות","synonyms":[],"ex_en":"I would like an opportunity to explain my plan.","ex_he":"הייתי רוצה הזדמנות להסביר את תכניתי.","family_members":[]},{"serial":82,"en":"barbecue","pos":"Noun","mean_he":"מנגל","synonyms":[],"ex_en":"We will have a barbecue at the beach.","ex_he":"נעשה מנגל על החוף.","family_members":[]},{"serial":829,"en":"scissors","pos":"Noun","mean_he":"מספריים","synonyms":[],"ex_en":"Pass me the scissors, please.","ex_he":"העבר לי את המספריים, בבקשה.","family_members":[]},{"serial":5,"en":"abroad","pos":"Adverb","mean_he":"בחו\"ל","synonyms":[],"ex_en":"My family lived abroad for two years.","ex_he":"המשפחה שלי גרה בחו\"ל במשך שנתיים.","family_members":[]},{"serial":8,"en":"accident","pos":"Noun","mean_he":"תאונה","synonyms":[],"ex_en":"I had an accident at work too.","ex_he":"גם הייתה לי בעבודה תאונה.","family_members":[]}];</script><script src="../flashcard-runtime-en.js?v=20260830-central-pilot1"></script><script src="../flashcard-navigation.js?v=20260830-answer-flash1"></script><script>window.EFN_PAGE_WORDS=words;</script><script src="../learning-loop.js?v=20260825-stage8"></script><script src="../practice-segments.js?v=20260827-stage2"></script><script src="../practice-session.js?v=20260827-segments-stage2"></script><script src="../practice-panel.js?v=20260831-feedback-transition1"></script><script src="../stage8-rollout.js?v=20260828-core1-segments-stage5"></script><script src="../vocab-practice.js?v=20260831-feedback-transition1"></script><script src="../analytics.js?v=20260825-stage8"></script></body></html>
