ols" role="group" aria-label="Flashcard controls"><button class="btn secondary" id="previous" type="button">← Previous</button><button class="btn" id="flipButton" type="button" aria-pressed="false">Show answer</button><button class="btn secondary" id="next" type="button">Next →</button></div></main></div><footer><a href="../index.html">Home</a><span>E‑Vocab Band II</span><a href="#">Accessibility</a></footer></div><script>const words=[{"serial":1080,"en":"worse","pos":"Adverb","mean_he":"גרוע יותר","synonyms":[],"ex_en":"Nothing can be worse than that, Dan.","ex_he":"שום דבר לא יכול להיות יותר גרוע מזה, דן.","family_members":[]},{"serial":56,"en":"around","pos":"Adverb","mean_he":"בסביבה; מסביב","synonyms":["approximately"],"ex_en":"I want to be around you, Dan.","ex_he":"אני רוצה להיות בסביבה שלך, דן.","family_members":[]},{"serial":398,"en":"general","pos":"Adjective","mean_he":"כללי","synonyms":["common, usually"],"ex_en":"In general, women live longer than men, Dan.","ex_he":"באופן כללי, נשים חיות יותר מגברים, דן.","family_members":[{"word":"generally","pos":"Adverb"}]},{"serial":134,"en":"broken","pos":"Adjective","mean_he":"שבור","synonyms":[],"ex_en":"My watch is broken, Dan.","ex_he":"השעון שלי שבור, דן.","family_members":[]},{"serial":184,"en":"chat","pos":"Verb","mean_he":"לשוחח","synonyms":[],"ex_en":"Can we chat after class?","ex_he":"אפשר לשוחח אחרי השיעור?","family_members":[]},{"serial":744,"en":"preparation","pos":"Noun","mean_he":"הכנה","synonyms":[],"ex_en":"Preparation takes time.","ex_he":"הכנה דורשת זמן.","family_members":[{"word":"prepared","pos":"Adjective"}]},{"serial":926,"en":"surely","pos":"Adverb","mean_he":"בוודאי","synonyms":[],"ex_en":"Surely you can see that, Maya.","ex_he":"בוודאי את יכולה לראות את זה, מאיה.","family_members":[{"word":"ensure","pos":"Verb"}]},{"serial":359,"en":"fight","pos":"Verb","mean_he":"להילחם","synonyms":["use force"],"ex_en":"I'm not ready to fight, Noa.","ex_he":"אני לא מוכנה להילחם, נועה.","family_members":[]},{"serial":325,"en":"equipment","pos":"Noun","mean_he":"ציוד","synonyms":[],"ex_en":"We have the equipment, Ron.","ex_he":"יש לנו את הציוד, רון.","family_members":[]},{"serial":760,"en":"pure","pos":"Adjective","mean_he":"טהור","synonyms":["not mixed","clean"],"ex_en":"Dan said, “It was pure chaos.”","ex_he":"דן אמר: „זה היה תוהו ובוהו טהור.”","family_members":[]},{"serial":482,"en":"image","pos":"Noun","mean_he":"תמונה; דמות; דימוי","synonyms":["mental picture"],"ex_en":"The image is clear.","ex_he":"התמונה ברורה.","family_members":[]},{"serial":73,"en":"awake","pos":"Adjective","mean_he":"ער","synonyms":[],"ex_en":"I was awake the whole time, Ron.","ex_he":"הייתי ערה במשך כל הזמן, רון.","family_members":[]},{"serial":631,"en":"most","pos":"Determiner","mean_he":"רוב הספר","synonyms":["almost all"],"ex_en":"Ron said, “That's how most people do it.”","ex_he":"רון אמר: „כך עושים את זה רוב האנשים.”","family_members":[]},{"serial":80,"en":"balloon","pos":"Noun","mean_he":"בלון","synonyms":[],"ex_en":"I want the blue balloon.","ex_he":"אני רוצה את הבלון הכחול.","family_members":[]},{"serial":188,"en":"check-in (desk)","pos":"Noun","mean_he":"צ'ק-אין (שולחן העבודה)","synonyms":[],"ex_en":"What time should I check in, Dan?","ex_he":"באיזו שעה אני צריך לבצע צ'ק-אין, דן?","family_members":[]},{"serial":1040,"en":"visit","pos":"Verb","mean_he":"לבקר","synonyms":["Internet"],"ex_en":"I can't visit you every day, Maya.","ex_he":"אני לא יכולה לבקר אותך כל יום, מאיה.","family_members":[]},{"serial":182,"en":"charge","pos":"Verb","mean_he":"לחייב; לגבות","synonyms":["money"],"ex_en":"Do you charge for delivery, Dan?","ex_he":"אתם מחייבים על המשלוח, דן?","family_members":[]},{"serial":457,"en":"hobby","pos":"Noun","mean_he":"תחביב","synonyms":[],"ex_en":"My hobby is playing the piano, Ron.","ex_he":"התחביב שלי הוא נגינה בפסנתר, רון.","family_members":[]},{"serial":37,"en":"alter","pos":"Verb","mean_he":"לשנות","synonyms":[],"ex_en":"Ron said, “She had to alter her dress by herself.”","ex_he":"רון אמר: „היא הצטרכה לשנות את השמלה בעצמה.”","family_members":[]},{"serial":757,"en":"prove","pos":"Verb","mean_he":"להוכיח","synonyms":[],"ex_en":"Are you able to prove it, Ron?","ex_he":"אתה יכול להוכיח את זה, רון?","family_members":[]},{"serial":364,"en":"first of all","pos":"Idiom","mean_he":"קודם כל","synonyms":[],"ex_en":"Let's do this first of all, Dan.","ex_he":"בואו קודם כל נעשה את זה, דן.","family_members":[]},{"serial":375,"en":"for","pos":"Preposition","mean_he":"למשהו","synonyms":["get, at a time, help"],"ex_en":"Can I do anything for you, Ron?","ex_he":"האם אני יכול לעשות משהו בשבילך, רון?","family_members":[]},{"serial":33,"en":"alive","pos":"Adjective","mean_he":"בחיים","synonyms":["alive now"],"ex_en":"I wish she were alive today.","ex_he":"הלוואי והיא הייתה היום בין החיים.","family_members":[{"word":"living","pos":"Adjective"}]},{"serial":496,"en":"in case of something","pos":"Phrase","mean_he":"במקרה של משהו","synonyms":[],"ex_en":"In case of fire, break this window, Dan.","ex_he":"במקרה של שריפה יש לשבור את החלון, דן.","family_members":[]},{"serial":929,"en":"synagogue","pos":"Noun","mean_he":"בית הכנסת","synonyms":[],"ex_en":"Noa asked, “Where's the synagogue?”","ex_he":"נועה שאלה: „איפה בית הכנסת?”","family_members":[]},{"serial":177,"en":"chance","pos":"Noun","mean_he":"סִכּוּי; צַ'אנְס; מַזָּל","synonyms":["possibility"],"ex_en":"Give me a chance, Ron.","ex_he":"תן לי צ'אנס, רון.","family_members":[]},{"serial":249,"en":"cry","pos":"Verb","mean_he":"לבכות","synonyms":[],"ex_en":"I used to cry a lot, Ron.","ex_he":"בעבר נהגתי לבכות הרבה, רון.","family_members":[]},{"serial":286,"en":"dirt","pos":"Noun","mean_he":"לכלוך","synonyms":[],"ex_en":"There is dirt on the floor.","ex_he":"יש לכלוך על הרצפה.","family_members":[{"word":"dirty","pos":"Adjective"}]},{"serial":1059,"en":"whenever","pos":"Conjunction","mean_he":"בכל פעם","synonyms":[],"ex_en":"Whenever I call, he is out, Ron.","ex_he":"בכל פעם שאני מתקשר אליו, הוא לא בבית, רו
