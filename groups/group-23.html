 help of something","pos":"Phrase","mean_he":"בעזרת משהו","synonyms":[],"ex_en":"We finished with the help of friends.","ex_he":"סיימנו בעזרת חברים.","family_members":[]},{"serial":1711,"en":"lie","pos":"Verb","mean_he":"לשקר","synonyms":["say s'thing that is not true, to deceive"],"ex_en":"We cannot lie to you.","ex_he":"אנו לא יכולים לשקר לכם.","family_members":[]},{"serial":1700,"en":"law","pos":"Noun","mean_he":"חוק","synonyms":["academic subject"],"ex_en":"That law can be interpreted in many ways.","ex_he":"חוק זה יכול להתפרש בהרבה מובנים.","family_members":[]},{"serial":1946,"en":"see","pos":"Verb","mean_he":"לראות","synonyms":["understand"],"ex_en":"Do you really want to see it?","ex_he":"באמת אתה רוצה לראות את זה?","family_members":[]},{"serial":1499,"en":"experience","pos":"Verb","mean_he":"לחוות","synonyms":["past events in one's life"],"ex_en":"We want to experience village life.","ex_he":"אנחנו רוצים לחוות את חיי הכפר.","family_members":[]},{"serial":1159,"en":"at its best","pos":"Idiom","mean_he":"במיטבו","synonyms":[],"ex_en":"This team is at its best today.","ex_he":"הקבוצה הזאת במיטבה היום.","family_members":[]},{"serial":1726,"en":"make","pos":"Verb","mean_he":"לעשות; להכין","synonyms":["cause"],"ex_en":"We want to make her happy.","ex_he":"אנחנו רוצים לעשות אותה מאושרת.","family_members":[]},{"serial":1475,"en":"engineer","pos":"Noun","mean_he":"מהנדס","synonyms":[],"ex_en":"My father was an engineer too.","ex_he":"גם אבי היה מהנדס.","family_members":[{"word":"engineering","pos":"Noun"}]},{"serial":1133,"en":"anyhow","pos":"Adverb","mean_he":"בכל מקרה","synonyms":[],"ex_en":"Anyhow, we need to begin.","ex_he":"בכל מקרה, אנחנו צריכים להתחיל.","family_members":[]},{"serial":1653,"en":"in other words","pos":"Idiom","mean_he":"במילים אחרות","synonyms":[],"ex_en":"In other words, be really careful.","ex_he":"במילים אחרות, תזהר.","family_members":[]},{"serial":1100,"en":"accurate","pos":"Adjective","mean_he":"מדויק","synonyms":[],"ex_en":"Our watch is very accurate.","ex_he":"השעון שלנו מדויק מאוד.","family_members":[{"word":"accurately (Adverb); accuracy","pos":"Noun"}]},{"serial":1502,"en":"expert","pos":"Noun","mean_he":"מומחה","synonyms":[],"ex_en":"I am not an expert.","ex_he":"אני לא מומחה.","family_members":[]},{"serial":1440,"en":"documentary","pos":"Noun","mean_he":"סרט התיעודי","synonyms":[],"ex_en":"I am making a documentary.","ex_he":"אני מפיק סרט דוקומנטרי.","family_members":[]},{"serial":1482,"en":"escape","pos":"Verb","mean_he":"לברוח","synonyms":[],"ex_en":"The students tried to escape.","ex_he":"התלמידים ניסו לברוח.","family_members":[]},{"serial":2140,"en":"viral","pos":"Adjective","mean_he":"ויראלי","synonyms":["to describe something that quickly becomes popular or well known on the Internet"],"ex_en":"The video went viral.","ex_he":"הסרטון הפך לוויראלי.","family_members":[]},{"serial":1147,"en":"arrange","pos":"Verb","mean_he":"לארגן","synonyms":[],"ex_en":"I believe I can arrange that.","ex_he":"אני חושב שאני יכול לארגן את זה.","family_members":[{"word":"arrangement","pos":"Noun"}]},{"serial":1629,"en":"hot","pos":"Adjective","mean_he":"חם","synonyms":["spicy"],"ex_en":"Tomorrow is a very hot day.","ex_he":"מחר יום חם מאד.","family_members":[]},{"serial":1758,"en":"model","pos":"Noun","mean_he":"דגם","synonyms":["person"],"ex_en":"It is an older model.","ex_he":"זה דגם ישן יותר.","family_members":[]},{"serial":1641,"en":"if I were you","pos":"Idiom","mean_he":"אם הייתי במקומך","synonyms":[],"ex_en":"I would say no if I were you.","ex_he":"הייתי מסרב לו הייתי במקומך.","family_members":[]},{"serial":2044,"en":"tag","pos":"Noun","mean_he":"תג","synonyms":["link to someone's profile from a photo or comment on Internet"],"ex_en":"Read the tag on the shirt.","ex_he":"קרא את התג שעל החולצה.","family_members":[]},{"serial":1925,"en":"roll","pos":"Noun","mean_he":"גליל","synonyms":[],"ex_en":"We need a roll of paper.","ex_he":"אנחנו צריכים גליל נייר.","family_members":[]},{"serial":1660,"en":"individual","pos":"Adjective","mean_he":"אינדיבידואלי","synonyms":[],"ex_en":"Each student has an individual task.","ex_he":"לכל תלמיד יש משימה אישית.","family_members":[]},{"serial":2154,"en":"which","pos":"Determiner","mean_he":"איזה ספר","synonyms":["adding information"],"ex_en":"Which house is yours?","ex_he":"איזה בית הוא שלך?","family_members":[]},{"serial":1519,"en":"fault","pos":"Noun","mean_he":"תקלה","synonyms":[],"ex_en":"There is a fault in the machine.","ex_he":"יש תקלה במכונה.","family_members":[]},{"serial":1771,"en":"northern","pos":"Adjective","mean_he":"צפוני","synonyms":[],"ex_en":"They visited Northern Europe.","ex_he":"הם ביקרו בצפון אירופה.","family_members":[]},{"serial":1371,"en":"count","pos":"Verb","mean_he":"לספור","synonyms":["see how many"],"ex_en":"My son cannot count yet.","ex_he":"הבן שלי לא יודע עדיין לספור.","family_members":[]},{"serial":1497,"en":"expectation","pos":"Noun","mean_he":"ציפייה","synonyms":[],"ex_en":"My expectation was too high.","ex_he":"הציפייה שלי הייתה גבוהה מדי.","family_members":[]},{"serial":1685,"en":"killed","pos":"Adjective","mean_he":"להיהרג","synonyms":[],"ex_en":"Three people were killed.","ex_he":"שלושה אנשים נהרגו.","family_members":[{"word":"killer (Noun); killing","pos":"Noun"}]},{"serial":1091,"en":"a great deal","pos":"Phrase","mean_he":"הרבה מאוד","synonyms":[],"ex_en":"This job takes a great deal of time.","ex_he":"העבודה הזאת דורשת זמן רב.","family_members":[]},{"serial":2099,"en":"translate","pos":"Verb","mean_he":"לתרגם","synonyms":[],"ex_en":"Could you please translate that for me?","ex_he":"אתה מוכן לתרגם את זה עבורי בבקשה?","family_members":[{"word":"translation (Noun); translator","pos":"Noun"}]},{"serial":1728,"en":"make somebody do something","pos":"Phrase","mean_he":"לגרום למישהו לעשות משהו","synonyms":[],"ex_en":"You cannot make me do that.","ex_he":"את לא יכולה לאלץ אותי לעשות זאת.","family_members":[]},{"serial":1892,"en":"raise","pos":"Verb","mean_he":"להעלות","synonyms":["increase"],"ex_en":
