<script>
window.addEventListener("DOMContentLoaded",()=>{
  const front=document.getElementById("cardFront");
  const hint=front.querySelector(":scope > .hint");
  const cardFoot=document.createElement("div");
  const spellButton=document.createElement("button");
  cardFoot.className="card-foot";
  spellButton.className="spell";
  spellButton.id="spellBtn";
  spellButton.type="button";
  spellButton.textContent="ABC · Spell";
  spellButton.hidden=true;
  cardFoot.append(spellButton,hint);
  front.appendChild(cardFoot);

  let spellingRunId=0;

  function isSpellableHeadword(text){
    return /^[A-Za-z]+$/.test(text.trim());
  }

  function sleep(milliseconds){
    return new Promise(resolve=>setTimeout(resolve,milliseconds));
  }

  function clearLetterHighlight(){
    const wordElement=document.getElementById("wordEn");
    wordElement.classList.remove("spelling");
    wordElement.querySelectorAll(".word-letter").forEach(letter=>letter.classList.remove("active"));
  }

  function stopSpelling(cancelSpeech){
    spellingRunId+=1;
    clearLetterHighlight();
    spellButton.disabled=false;
    if(cancelSpeech&&"speechSynthesis" in window)window.speechSynthesis.cancel();
  }

  function renderHeadword(){
    stopSpelling(false);
    const item=words[currentIndex];
    const text=item.en.trim();
    const wordElement=document.getElementById("wordEn");
    const spellable=isSpellableHeadword(text);
    wordElement.classList.toggle("spellable",spellable);
    wordElement.replaceChildren();
    spellButton.hidden=!spellable;
    spellButton.disabled=false;

    if(!spellable){
      wordElement.textContent=item.en;
      spellButton.removeAttribute("aria-label");
      return;
    }

    const accessibleWord=document.createElement("span");
    accessibleWord.className="sr-only";
    accessibleWord.textContent=text;
    wordElement.appendChild(accessibleWord);
    Array.from(text).forEach(character=>{
      const letter=document.createElement("span");
      letter.className="word-letter";
      letter.dataset.letter=character.toUpperCase();
      letter.setAttribute("aria-hidden","true");
      letter.textContent=character;
      wordElement.appendChild(letter);
    });
    spellButton.setAttribute("aria-label","Spell the word "+text);
  }

  function speakLetter(letter,runId){
    return new Promise(resolve=>{
      if(runId!==spellingRunId||!("speechSynthesis" in window)){
        setTimeout(resolve,340);
        return;
      }
      const utterance=new SpeechSynthesisUtterance(letter);
      utterance.lang="en-US";
      utterance.rate=1;
      utterance.onend=resolve;
      utterance.onerror=resolve;
      window.speechSynthesis.speak(utterance);
    });
  }

  async function spellCurrentHeadword(event){
    event.stopPropagation();
    const item=words[currentIndex];
    if(!isSpellableHeadword(item.en))return;
    clearTimeout(scheduleWordSpeech.timer);
    stopSpelling(true);
    const runId=spellingRunId;
    const startingIndex=currentIndex;
    const wordElement=document.getElementById("wordEn");
    const letters=Array.from(wordElement.querySelectorAll(".word-letter"));
    spellButton.disabled=true;
    announce("Spelling started.");

    await speakLetter(item.en,runId);
    if(runId!==spellingRunId||startingIndex!==currentIndex||card.classList.contains("flipped"))return;
    await sleep(180);
    wordElement.classList.add("spelling");

    for(const letter of letters){
      if(runId!==spellingRunId||startingIndex!==currentIndex||card.classList.contains("flipped"))return;
      letters.forEach(candidate=>candidate.classList.remove("active"));
      letter.classList.add("active");
      await speakLetter(letter.dataset.letter,runId);
      await sleep(120);
    }

    if(runId===spellingRunId&&startingIndex===currentIndex){
      clearLetterHighlight();
      await sleep(180);
      await speakLetter(item.en,runId);
    }

    if(runId===spellingRunId&&startingIndex===currentIndex){
      spellButton.disabled=false;
      announce("Spelling complete.");
    }
  }

  spellButton.addEventListener("click",spellCurrentHeadword);
  document.getElementById("audioStart").addEventListener("click",()=>stopSpelling(true),{capture:true});

  const originalUpdateCard=updateCard;
  updateCard=function(){
    stopSpelling(true);
    originalUpdateCard();
    renderHeadword();
  };

  const originalToggleCard=toggleCard;
  const flipButton=document.getElementById("flipButton");
  flipButton.removeEventListener("click",originalToggleCard);
  toggleCard=function(event){
    stopSpelling(true);
    return originalToggleCard(event);
  };
  flipButton.addEventListener("click",toggleCard);

  const originalSpeakText=speakText;
  speakText=function(text){
    stopSpelling(false);
    return originalSpeakText(text);
  };

  updateCard();
});
</script>

שוב כך.","family_members":[]},{"serial":641,"en":"myself","pos":"Pronoun","mean_he":"את עצמי","synonyms":[],"ex_en":"I consider myself one of you too.","ex_he":"גם אני מחשיב את עצמי כאחד מכם.","family_members":[]},{"serial":900,"en":"star","pos":"Noun","mean_he":"כוכב","synonyms":["performer"],"ex_en":"My sister made me a star.","ex_he":"אחותי עשתה ממני כוכב.","family_members":[]},{"serial":224,"en":"context","pos":"Noun","mean_he":"הקשר","synonyms":[],"ex_en":"It depends on the context too.","ex_he":"גם תלוי בהקשר.","family_members":[]}];let currentIndex=0;const AUDIO_PREFERENCE_KEY="evocab-band-ii-auto-audio";function readAudioPreference(){try{return window.localStorage.getItem(AUDIO_PREFERENCE_KEY)==="on"}catch{return false}}function rememberAudioPreference(){try{window.localStorage.setItem(AUDIO_PREFERENCE_KEY,"on")}catch{}}let automaticAudioEnabled=readAudioPreference();let touchStartX=0;let touchEndX=0;let didSwipe=false;const card=document.getElementById("flashcard");const audioButton=document.getElementById("audioStart");const AUDIO_LABEL_OFF=document.documentElement.lang==="ar"?"🔊 تشغيل الصوت تلقائيًا":"🔊 Turn on audio";const AUDIO_LABEL_ON=document.documentElement.lang==="ar"?"🔊 الصوت مفعّل":"🔊 Audio on";function syncAudioButton(){const enabled=automaticAudioEnabled;audioButton.textContent=enabled?AUDIO_LABEL_ON:AUDIO_LABEL_OFF;audioButton.setAttribute("aria-pressed",String(enabled));audioButton.setAttribute("aria-label",enabled?(document.documentElement.lang==="ar"?"الصوت التلقائي مفعّل":"Automatic audio is on"):(document.documentElement.lang==="ar"?"تشغيل القراءة التلقائية":"Turn on automatic audio"));audioButton.disabled=enabled;const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;audioButton.classList.toggle("audio-attention",!enabled&&!reduced)}function enableAutomaticAudio(announceState,speakCurrent){automaticAudioEnabled=true;rememberAudioPreference();if("speechSynthesis" in window)window.speechSynthesis.resume();syncAudioButton();if(announceState)announce(document.documentElement.lang==="ar"?"تم تفعيل الصوت. ستبدأ القراءة التلقائية بعد 0.9 ثانية.":"Audio enabled. Automatic pronunciation will start in 0.9 seconds.");speakCurrent?speakText(words[currentIndex].en):scheduleWordSpeech()}function speakText(text){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=.8;window.speechSynthesis.speak(utterance)}function scheduleWordSpeech(){clearTimeout(scheduleWordSpeech.timer);const scheduledIndex=currentIndex;scheduleWordSpeech.timer=setTimeout(()=>{if(automaticAudioEnabled&&scheduledIndex===currentIndex&&!card.classList.contains("flipped"))speakText(words[currentIndex].en)},900)}function scheduleExampleSpeech(){clearTimeout(scheduleWordSpeech.timer);const scheduledIndex=currentIndex;scheduleWordSpeech.timer=setTimeout(()=>{if(automaticAudioEnabled&&scheduledIndex===currentIndex&&card.classList.contains("flipped")&&words[currentIndex].ex_en)speakText(words[currentIndex].ex_en)},900)}function updateCard(){const item=words[currentIndex];card.classList.remove("flipped");const front=document.getElementById("cardFront");const back=document.getElementById("cardBack");front.setAttribute("aria-hidden","false");back.setAttribute("aria-hidden","true");front.inert=false;back.inert=true;document.getElementById("ttsBtn").disabled=false;const flip=document.getElementById("flipButton");flip.textContent="Show answer";flip.setAttribute("aria-pressed","false");document.getElementById("posBadge").textContent=item.pos.toUpperCase();document.getElementById("wordEn").textContent=item.en;document.getElementById("transHe").textContent=item.mean_he;const synonymsBox=document.getElementById("synonymsBox");synonymsBox.style.display=item.synonyms.length?"block":"none";document.getElementById("wordSynonyms").textContent=item.synonyms.join(", ");document.getElementById("exEn").textContent=item.ex_en;document.getElementById("exHe").textContent=item.ex_he;const familyBox=document.getElementById("familyBox");const familyList=document.getElementById("familyList");const grid=document.getElementById("detailsGrid");familyList.replaceChildren();if(item.family_members.length){familyBox.style.display="block";grid.classList.remove("family-empty");item.family_members.forEach(member=>{const li=document.createElement("li");const word=document.createElement("span");word.className="family-word";word.textContent=member.word;const pos=document.createElement("span");pos.className="family-pos";pos.textContent=member.pos?" — "+member.pos.toLowerCase():"";li.append(word,pos);familyList.appendChild(li)})}else{familyBox.style.display="none";grid.classList.add("family-empty")}document.getElementById("counter").textContent=(currentIndex+1)+" / "+words.length;announce("Word shown.");scheduleWordSpeech()}function announce(message){const status=document.getElementById("cardStatus");status.textContent="";setTimeout(()=>status.textContent=message,80)}function toggleCard(event){if(event)event.stopPropagation();const isFlipped=card.classList.toggle("flipped");const front=document.getElementById("cardFront");const back=document.getElementById("cardBack");front.setAttribute("aria-hidden",String(isFlipped));back.setAttribute("aria-hidden",String(!isFlipped));front.inert=isFlipped;back.inert=!isFlipped;document.getElementById("ttsBtn").disabled=isFlipped;const flip=document.getElementById("flipButton");flip.textContent=isFlipped?"Show word":"Show answer";flip.setAttribute("aria-pressed",String(isFlipped));announce(isFlipped?"Answer shown.":"Word shown.");isFlipped?scheduleExampleSpeech():scheduleWordSpeech()}function nextCard(){currentIndex=(currentIndex+1)%words.length;updateCard()}function prevCard(){currentIndex=(currentIndex-1+words.length)%words.length;updateCard()}card.addEventListener("click",event=>{if(didSwipe){didSwipe=false;event.preventDefault();return}toggleCard(event)});card.addEventListener("touchstart",event=>{touchStartX=event.changedTouches[0].screenX;touchEndX=touchStartX;didSwipe=false},{passive:true});card.addEventListener("touchend",event=>{touchEndX=event.changedTouches[0].screenX;const distance=touchEndX-touchStartX;if(Math.abs(distance)>50){didSwipe=true;distance<0?nextCard():prevCard();setTimeout(()=>{didSwipe=false},400)}},{passive:true});document.getElementById("previous").addEventListener("click",prevCard);document.getElementById("next").addEventListener("click",nextCard);document.getElementById("flipButton").addEventListener("click",toggleCard);document.getElementById("exampleAudio").addEventListener("click",event=>{event.stopPropagation();speakText(words[currentIndex].ex_en)});document.getElementById("ttsBtn").addEventListener("click",event=>{event.stopPropagation();enableAutomaticAudio(false,true)});document.getElementById("audioStart").addEventListener("click",event=>{event.stopPropagation();enableAutomaticAudio(true,false)});document.addEventListener("keydown",event=>{if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==="ArrowRight"){event.preventDefault();nextCard()}if(event.key==="ArrowLeft"){event.preventDefault();prevCard()}});syncAudioButton();updateCard();</script><script src="../analytics.js"></script></body></html>
