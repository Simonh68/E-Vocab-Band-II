ipe=false},400)}},{passive:true});document.getElementById("previous").addEventListener("click",prevCard);document.getElementById("next").addEventListener("click",nextCard);document.getElementById("flipButton").addEventListener("click",toggleCard);document.getElementById("ttsBtn").addEventListener("click",event=>{event.stopPropagation();automaticAudioEnabled=true;const button=document.getElementById("audioStart");button.textContent="🔊 Audio on";button.setAttribute("aria-pressed","true");button.disabled=true;speakText(words[currentIndex].en)});document.getElementById("audioStart").addEventListener("click",event=>{event.stopPropagation();automaticAudioEnabled=true;if("speechSynthesis" in window)window.speechSynthesis.resume();event.currentTarget.textContent="🔊 Audio on";event.currentTarget.setAttribute("aria-pressed","true");event.currentTarget.disabled=true;announce("Audio enabled. Automatic pronunciation will start in 0.9 seconds.");scheduleWordSpeech()});document.addEventListener("keydown",event=>{if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==="ArrowRight"){event.preventDefault();nextCard()}if(event.key==="ArrowLeft"){event.preventDefault();prevCard()}});updateCard();</script></body></html>
