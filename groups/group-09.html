un","mean_he":"חלון","synonyms":["computer"],"ex_en":"Who exactly was this window broken by?","ex_he":"מי בדיוק שבר את החלון הזה?","family_members":[]},{"serial":126,"en":"boyfriend","pos":"Noun","mean_he":"חבר","synonyms":[],"ex_en":"I have a boyfriend back home too.","ex_he":"גם לי יש בבית חבר.","family_members":[]},{"serial":43,"en":"announce","pos":"Verb","mean_he":"להכריז","synonyms":[],"ex_en":"They will announce the result tomorrow.","ex_he":"הם יודיעו על התוצאה מחר.","family_members":[{"word":"announcement","pos":"Noun"}]},{"serial":255,"en":"daily","pos":"Adjective","mean_he":"יומיומי","synonyms":[],"ex_en":"What exactly's the daily fee?","ex_he":"מה בדיוק התעריף היומי?","family_members":[]},{"serial":64,"en":"at first","pos":"Phrase","mean_he":"בהתחלה","synonyms":[],"ex_en":"I did not like it at first.","ex_he":"בהתחלה לא אהבתי את זה.","family_members":[]},{"serial":995,"en":"too bad","pos":"Idiom","mean_he":"חבל","synonyms":[],"ex_en":"It was too bad you could not come.","ex_he":"חבל שלא יכולת לבוא.","family_members":[]},{"serial":149,"en":"cancer","pos":"Noun","mean_he":"סרטן","synonyms":[],"ex_en":"Doctors can treat some types of cancer.","ex_he":"רופאים יכולים לטפל בכמה סוגים של סרטן.","family_members":[]},{"serial":572,"en":"like","pos":"Preposition","mean_he":"כמו","synonyms":["such as"],"ex_en":"We love you like a brother.","ex_he":"אנחנו אוהבים אותך כמו אח.","family_members":[]},{"serial":654,"en":"never mind","pos":"Idiom","mean_he":"לא משנה","synonyms":[],"ex_en":"Please never mind what he said.","ex_he":"בבקשה, זה לא משנה מה שהוא אמר.","family_members":[]},{"serial":433,"en":"hardly ever","pos":"Idiom","mean_he":"כמעט אף פעם","synonyms":[],"ex_en":"We hardly ever eat out.","ex_he":"אנחנו כמעט אף פעם לא אוכלים בחוץ.","family_members":[]},{"serial":862,"en":"silence","pos":"Noun","mean_he":"שתיקה","synonyms":[],"ex_en":"There was a silence too.","ex_he":"גם שררה שתיקה.","family_members":[]},{"serial":441,"en":"headache","pos":"Noun","mean_he":"כאב ","pos":"Noun","mean_he":"חנות הכלבו","synonyms":[],"ex_en":"We bought it at a department store.","ex_he":"קנינו את זה בחנות כלבו.","family_members":[]},{"serial":590,"en":"love","pos":"Noun","mean_he":"אהבה","synonyms":["of somebody"],"ex_en":"My brother wrote me a love letter.","ex_he":"אחי כתב לי מכתב אהבה.","family_members":[]},{"serial":563,"en":"lend","pos":"Verb","mean_he":"להלוות","synonyms":[],"ex_en":"Can you please lend me a little money?","ex_he":"האם תוכל להלוות לי מעט כסף בבקשה?","family_members":[]},{"serial":953,"en":"that's all right","pos":"Idiom","mean_he":"זה בסדר","synonyms":[],"ex_en":"I wonder if that is all right with the boy.","ex_he":"אני תוהה אם זה בסדר מצידו של דן.","family_members":[]},{"serial":626,"en":"modern","pos":"Adjective","mean_he":"מודרני","synonyms":[],"ex_en":"Her house is really modern.","ex_he":"ביתה מודרני מאוד.","family_members":[]},{"serial":843,"en":"serve","pos":"Verb","mean_he":"לשרת","synonyms":["in restaurant, shop etc","dealing with a customer"],"ex_en":"We want to serve my country.","ex_he":"אנחנו רוצים לשרת את מולדתי.","family_members":[{"word":"service","pos":"Noun"}]},{"serial":934,"en":"take something back","pos":"Phrasal verb","mean_he":"להחזיר משהו","synonyms":[],"ex_en":"Please take this shirt back to the shop.","ex_he":"החזר בבקשה את החולצה הזאת לחנות.","family_members":[]},{"serial":46,"en":"anyway","pos":"Adverb","mean_he":"בכל מקרה","synonyms":["more importantly"],"ex_en":"What exactly do you eat, anyway?","ex_he":"בדיוק בכל אופן, מה אתה אוכל?","family_members":[]},{"serial":719,"en":"personal","pos":"Adjective","mean_he":"אישי","synonyms":["private"],"ex_en":"It was personal too.","ex_he":"גם זה היה אישי.","family_members":[]},{"serial":490,"en":"in","pos":"Preposition","mean_he":"ב־; בתוך; במהלך","synonyms":["during"],"ex_en":"Please put the money in the bag.","ex_he":"בבקשה, שים את הכסף בתוך התיק.","family_members":[]},{"serial":386,"en":"friendship","pos":"Noun","mean_he":"ידידות","synonyms":[],"ex_
