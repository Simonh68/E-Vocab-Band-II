rs":[]},{"serial":2008,"en":"statue","pos":"Noun","mean_he":"פסל","synonyms":[],"ex_en":"The old statue has no head.","ex_he":"לפסל הישן אין ראש.","family_members":[]},{"serial":1868,"en":"pot","pos":"Noun","mean_he":"סיר","synonyms":[],"ex_en":"My brother fashioned an elegant pot out of clay.","ex_he":"אחי עיצב סיר אלגנטי מחמר.","family_members":[]},{"serial":1201,"en":"be welcome to do something","pos":"Phrase","mean_he":"מוזמן לעשות משהו","synonyms":[],"ex_en":"You are welcome to join us.","ex_he":"אתה מוזמן להצטרף אלינו.","family_members":[]},{"serial":1276,"en":"captain","pos":"Noun","mean_he":"קפטן","synonyms":[],"ex_en":"Suddenly, the captain left the ship too.","ex_he":"גם לפתע, הקפטן נטש את הספינה.","family_members":[]},{"serial":1355,"en":"confusion","pos":"Noun","mean_he":"בלבול","synonyms":[],"ex_en":"We can understand your confusion.","ex_he":"אנחנו יכולים להבין את מבוכתך.","family_members":[{"word":"confuse (Verb); confused (Adjective); confusing","pos":"Adjective"}]},{"serial":1717,"en":"lioness","pos":"Noun","mean_he":"לביאה","synonyms":[],"ex_en":"The lioness stayed near her cubs.","ex_he":"הלביאה נשארה ליד גוריה.","family_members":[]},{"serial":1859,"en":"poor","pos":"Adjective","mean_he":"עני","synonyms":["sympathy"],"ex_en":"My brother said he was poor.","ex_he":"אחי אמר שהוא היה עני.","family_members":[]},{"serial":1352,"en":"confidence","pos":"Noun","mean_he":"ביטחון","synonyms":["certainty"],"ex_en":"Self confidence is the key to success too.","ex_he":"גם ביטחון עצמי הוא המפתח להצלחה.","family_members":[{"word":"confident","pos":"Adjective"}]},{"serial":2011,"en":"stir","pos":"Verb","mean_he":"לערבב","synonyms":[],"ex_en":"Do not forget to stir the stew.","ex_he":"אל תשכחי לבחוש את הנזיד.","family_members":[]},{"serial":1675,"en":"It seems …","pos":"Phrase","mean_he":"נראה…","synonyms":[],"ex_en":"It seems that he is a student.","ex_he":"נראה שהוא תלמיד.","family_members":[]},{"serial":2114,"en":"underground","pos":"Adverb","mean_he":"מתחת לאד un"}]},{"serial":1714,"en":"likes and dislikes","pos":"Phrase","mean_he":"אוהב ולא אוהב","synonyms":[],"ex_en":"We talked about our likes and dislikes.","ex_he":"דיברנו על הדברים שאנחנו אוהבים ולא אוהבים.","family_members":[]},{"serial":1127,"en":"angry","pos":"Adjective","mean_he":"לכעוס","synonyms":[],"ex_en":"My brother should be angry.","ex_he":"אחי אמור לכעוס.","family_members":[{"word":"anger","pos":"Noun"}]},{"serial":1991,"en":"sorry","pos":"Adjective","mean_he":"תצטער","synonyms":["saying no, used to show politeness when refusing something"],"ex_en":"Do not be sorry.","ex_he":"אל תצטער.","family_members":[]},{"serial":2069,"en":"the other day","pos":"Phrase","mean_he":"לפני כמה ימים","synonyms":[],"ex_en":"I saw her at school the other day.","ex_he":"ראיתי אותה בבית הספר לפני כמה ימים.","family_members":[]},{"serial":2030,"en":"sunrise","pos":"Noun","mean_he":"זריחה","synonyms":[],"ex_en":"We left home before sunrise too.","ex_he":"גם יצאנו מהבית לפני הזריחה.","family_members":[]},{"serial":1875,"en":"prince","pos":"Noun","mean_he":"נסיך","synonyms":[],"ex_en":"Being a prince is not always easy.","ex_he":"לא תמיד קל להיות נסיך.","family_members":[{"word":"princess","pos":"Noun"}]},{"serial":1626,"en":"honest","pos":"Adjective","mean_he":"כנה","synonyms":[],"ex_en":"I will be honest with you.","ex_he":"אהיה כנה אתך.","family_members":[]},{"serial":1642,"en":"if only","pos":"Idiom","mean_he":"אם רק","synonyms":[],"ex_en":"If only I had done my homework!","ex_he":"לו רק הכנתי את שיעורי הבית!","family_members":[]},{"serial":1552,"en":"for instance","pos":"Phrase","mean_he":"למשל","synonyms":[],"ex_en":"Some animals, for instance dogs, help us.","ex_he":"יש בעלי חיים, למשל כלבים, שעוזרים לנו.","family_members":[]},{"serial":2141,"en":"virtual","pos":"Adjective","mean_he":"וירטואלי","synonyms":["computing"],"ex_en":"We had a virtual meeting.","ex_he":"קיימנו פגישה וירטואלית.","family_members":[{"word":"virtually","pos":"Adverb"}]},{"serial":1336,"en":"comment","pos":"Noun","mean_he":"הערה","synonyms":[],"ex_en":"Her comment helped the class.","ex_he":"ההערה שלה עזרה לכיתה.","family_members":[]},{"serial":1318,"en":"clear","pos":"Adjective","mean_he":"ברור","synonyms":["without obstacles"],"ex_en":"It is clear what must be done too.","ex_he":"גם ברור מה צריך לעשות.","family_members":[]},{"serial":1145,"en":"area","pos":"Noun","mean_he":"שטח","synonyms":["subject"],"ex_en":"The area is built up today.","ex_he":"היום זהו שטח בנוי.","family_members":[]},{"serial":1619,"en":"high-tech","pos":"Adjective","mean_he":"עתיר טכנולוגיה; טכנולוגי","synonyms":[],"ex_en":"The school has a high-tech laboratory.","ex_he":"בבית הספר יש מעבדה עתירת טכנולוגיה.","family_members":[]},{"serial":2120,"en":"up","pos":"Adverb","mean_he":"למעלה","synonyms":["increase"],"ex_en":"Exactly how did that get up there?","ex_he":"בדיוק איך זה הגיע פה למעלה?","family_members":[]},{"serial":1527,"en":"feel sorry for","pos":"Phrase","mean_he":"לרחם על","synonyms":[],"ex_en":"I feel sorry for the children too.","ex_he":"גם אני מרחם על הילדים.","family_members":[]}];</script><script src="../flashcard-runtime-en.js?v=20260830-central-pilot1"></script><script src="../flashcard-navigation.js?v=20260830-answer-flash1"></script><script>window.EFN_PAGE_WORDS=words;</script><script src="../learning-loop.js?v=20260825-stage8"></script><script src="../practice-session.js?v=20260825-stage8"></script><script src="../practice-panel.js?v=20260827-celebrations1"></script><script src="../stage8-rollout.js?v=20260825-stage8"></script><script src="../vocab-practice.js?v=20260827-celebrations1"></script><script src="../analytics.js?v=20260825-stage8"></script></body></html>
