","mean_he":"הלם","synonyms":[],"ex_en":"Dan said, “It was a shock, to be sure.”","ex_he":"דן אמר: „זה לבטח היה הלם.”","family_members":[]},{"serial":1591,"en":"go wrong","pos":"Phrase","mean_he":"להשתבש","synonyms":[],"ex_en":"Nothing else can go wrong, Ron.","ex_he":"שום דבר אחר לא יכול להשתבש, רון.","family_members":[]},{"serial":1987,"en":"solid","pos":"Adjective","mean_he":"מוצק","synonyms":["not liquid or gas","hard, without holes or spaces"],"ex_en":"The ice is solid now.","ex_he":"הקרח מוצק עכשיו.","family_members":[]},{"serial":1136,"en":"appear","pos":"Verb","mean_he":"נִרְאָה; הוֹפִיעַ; נִגְלָה","synonyms":["come into view","seem"],"ex_en":"Dan said, “That would appear to be correct.”","ex_he":"דן אמר: „זה נראה בסדר.”","family_members":[{"word":"appearance","pos":"Noun"}]},{"serial":2041,"en":"sympathy","pos":"Noun","mean_he":"אהדה","synonyms":[],"ex_en":"Do they deserve our sympathy, Ron?","ex_he":"האם האהדה שלנו מגיעה להם, רון?","family_members":[{"word":"sympathetic","pos":"Adjective"}]},{"serial":1738,"en":"mathematics","pos":"Noun","mean_he":"מתמטיקה","synonyms":[],"ex_en":"He likes mathematics, but I don't, Dan.","ex_he":"הוא אוהב מתמטיקה, אבל אני לא, דן.","family_members":[{"word":"math","pos":""}]},{"serial":1435,"en":"district","pos":"Noun","mean_he":"מחוז","synonyms":[],"ex_en":"Ron said, “The district is abundant in natural resources.”","ex_he":"רון אמר: „המחוז עשיר באוצרות טבע.”","family_members":[]},{"serial":1954,"en":"serious","pos":"Adjective","mean_he":"רציני","synonyms":[],"ex_en":"You really are serious, aren't you, Dan?","ex_he":"אתה באמת רציני, לא, דן?","family_members":[]},{"serial":1369,"en":"could","pos":"Verb","mean_he":"יכול","synonyms":["modal suggestion"],"ex_en":"Could you hand that to me, Noa?","ex_he":"את יכולה להעביר לי את זה, נועה?","family_members":[]},{"serial":2008,"en":"statue","pos":"Noun","mean_he":"פסל","synonyms":[],"ex_en":"Dan said, “The statue has no head.”","ex_he":"דן אמר: „לפסל אין ראש.”","family_members":[]},{"serial":1868,"en":"pot","pos":"Noun","mean_he":"סיר","synonyms":[],"ex_en":"Dan said, “He fashioned an elegant pot out of clay.”","ex_he":"דן אמר: „הוא עיצב סיר אלגנטי מחמר.”","family_members":[]},{"serial":1201,"en":"be welcome to do something","pos":"Phrase","mean_he":"מוזמן לעשות משהו","synonyms":[],"ex_en":"You are welcome to join us.","ex_he":"אתה מוזמן להצטרף אלינו.","family_members":[]},{"serial":1276,"en":"captain","pos":"Noun","mean_he":"קפטן","synonyms":[],"ex_en":"Suddenly, the captain left the ship, Dan.","ex_he":"לפתע, הקפטן נטש את הספינה, דן.","family_members":[]},{"serial":1355,"en":"confusion","pos":"Noun","mean_he":"בלבול","synonyms":[],"ex_en":"I can understand your confusion, Ron.","ex_he":"אני יכול להבין את מבוכתך, רון.","family_members":[{"word":"confuse (Verb); confused (Adjective); confusing","pos":"Adjective"}]},{"serial":1717,"en":"lioness","pos":"Noun","mean_he":"לביאה","synonyms":[],"ex_en":"The lioness stayed near her cubs.","ex_he":"הלביאה נשארה ליד גוריה.","family_members":[]},{"serial":1859,"en":"poor","pos":"Adjective","mean_he":"עני","synonyms":["sympathy"],"ex_en":"Ron said, “He said he was poor.”","ex_he":"רון אמר: „הוא אמר שהוא היה עני.”","family_members":[]},{"serial":1352,"en":"confidence","pos":"Noun","mean_he":"ביטחון","synonyms":["certainty"],"ex_en":"Self confidence is the key to success, Dan.","ex_he":"ביטחון עצמי הוא המפתח להצלחה, דן.","family_members":[{"word":"confident","pos":"Adjective"}]},{"serial":2011,"en":"stir","pos":"Verb","mean_he":"לערבב","synonyms":[],"ex_en":"Don't forget to stir the stew, Ron.","ex_he":"אל תשכחי לבחוש את הנזיד, רון.","family_members":[]},{"serial":1675,"en":"It seems …","pos":"Phrase","mean_he":"נראה…","synonyms":[],"ex_en":"Ron said, “It seems that he's a student.”","ex_he":"רון אמר: „נראה שהוא תלמיד.”","family_members":[]},{"serial":2114,"en":"underground","pos":"Adverb","mean_he":"מתחת לאדמה","synonyms":[],"ex_en":"Some animals live underground.","ex_he":"יש בעלי חיים שחיים מתחת לאדמה. );document.getElementById("audioStart").addEventListener("click",event=>{event.stopPropagation();automaticAudioEnabled=true;if("speechSynthesis" in window)window.speechSynthesis.resume();event.currentTarget.textContent="🔊 Audio on";event.currentTarget.setAttribute("aria-pressed","true");event.currentTarget.disabled=true;announce("Audio enabled. Automatic pronunciation will start in 0.9 seconds.");scheduleWordSpeech()});document.addEventListener("keydown",event=>{if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==="ArrowRight"){event.preventDefault();nextCard()}if(event.key==="ArrowLeft"){event.preventDefault();prevCard()}});updateCard();</script></body></html>
