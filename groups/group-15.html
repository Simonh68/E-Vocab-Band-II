<script>
window.addEventListener("DOMContentLoaded",()=>{
  const front=document.getElementById("cardFront");
  const hint=front.querySelector(":scope > .hint");
  const cardFoot=document.createElement("div");
  const spellButton=document.createElement("button");
  cardFoot.className="card-foot";
  spellButton.className="spell";
  spellButton.id="spellBtn";
  spellButton.type="button";
  spellButton.textContent="ABC · Spell";
  spellButton.hidden=true;
  cardFoot.append(spellButton,hint);
  front.appendChild(cardFoot);

  let spellingRunId=0;

  function isSpellableHeadword(text){
    return /^[A-Za-z]+$/.test(text.trim());
  }

  function sleep(milliseconds){
    return new Promise(resolve=>setTimeout(resolve,milliseconds));
  }

  function clearLetterHighlight(){
    const wordElement=document.getElementById("wordEn");
    wordElement.classList.remove("spelling");
    wordElement.querySelectorAll(".word-letter").forEach(letter=>letter.classList.remove("active"));
  }

  function stopSpelling(cancelSpeech){
    spellingRunId+=1;
    clearLetterHighlight();
    spellButton.disabled=false;
    if(cancelSpeech&&"speechSynthesis" in window)window.speechSynthesis.cancel();
  }

  function renderHeadword(){
    stopSpelling(false);
    const item=words[currentIndex];
    const text=item.en.trim();
    const wordElement=document.getElementById("wordEn");
    const spellable=isSpellableHeadword(text);
    wordElement.classList.toggle("spellable",spellable);
    wordElement.replaceChildren();
    spellButton.hidden=!spellable;
    spellButton.disabled=false;

    if(!spellable){
      wordElement.textContent=item.en;
      spellButton.removeAttribute("aria-label");
      return;
    }

    const accessibleWord=document.createElement("span");
    accessibleWord.className="sr-only";
    accessibleWord.textContent=text;
    wordElement.appendChild(accessibleWord);
    Array.from(text).forEach(character=>{
      const letter=document.createElement("span");
      letter.className="word-letter";
      letter.dataset.letter=character.toUpperCase();
      letter.setAttribute("aria-hidden","true");
      letter.textContent=character;
      wordElement.appendChild(letter);
    });
    spellButton.setAttribute("aria-label","Spell the word "+text);
  }

  function speakLetter(letter,runId){
    return new Promise(resolve=>{
      if(runId!==spellingRunId||!("speechSynthesis" in window)){
        setTimeout(resolve,340);
        return;
      }
      const utterance=new SpeechSynthesisUtterance(letter);
      utterance.lang="en-US";
      utterance.rate=1;
      utterance.onend=resolve;
      utterance.onerror=resolve;
      window.speechSynthesis.speak(utterance);
    });
  }

  async function spellCurrentHeadword(event){
    event.stopPropagation();
    const item=words[currentIndex];
    if(!isSpellableHeadword(item.en))return;
    clearTimeout(scheduleWordSpeech.timer);
    stopSpelling(true);
    const runId=spellingRunId;
    const startingIndex=currentIndex;
    const wordElement=document.getElementById("wordEn");
    const letters=Array.from(wordElement.querySelectorAll(".word-letter"));
    spellButton.disabled=true;
    announce("Spelling started.");

    await speakLetter(item.en,runId);
    if(runId!==spellingRunId||startingIndex!==currentIndex||card.classList.contains("flipped"))return;
    await sleep(180);
    wordElement.classList.add("spelling");

    for(const letter of letters){
      if(runId!==spellingRunId||startingIndex!==currentIndex||card.classList.contains("flipped"))return;
      letters.forEach(candidate=>candidate.classList.remove("active"));
      letter.classList.add("active");
      await speakLetter(letter.dataset.letter,runId);
      await sleep(120);
    }

    if(runId===spellingRunId&&startingIndex===currentIndex){
      clearLetterHighlight();
      await sleep(180);
      await speakLetter(item.en,runId);
    }

    if(runId===spellingRunId&&startingIndex===currentIndex){
      spellButton.disabled=false;
      announce("Spelling complete.");
    }
  }

  spellButton.addEventListener("click",spellCurrentHeadword);
  document.getElementById("audioStart").addEventListener("click",()=>stopSpelling(true),{capture:true});

  const originalUpdateCard=updateCard;
  updateCard=function(){
    stopSpelling(true);
    originalUpdateCard();
    renderHeadword();
  };

  const originalToggleCard=toggleCard;
  const flipButton=document.getElementById("flipButton");
  flipButton.removeEventListener("click",originalToggleCard);
  toggleCard=function(event){
    stopSpelling(true);
    return originalToggleCard(event);
  };
  flipButton.addEventListener("click",toggleCard);

  const originalSpeakText=speakText;
  speakText=function(text){
    stopSpelling(false);
    return originalSpeakText(text);
  };

  updateCard();
});
</script>

tton.offsetWidth;requestAnimationFrame(()=>audioButton.classList.add("audio-attention"))}}function setAutomaticAudioEnabled(enabled,announceState,speakCurrent){automaticAudioEnabled=enabled;rememberAudioPreference(enabled);if(!enabled){clearTimeout(scheduleWordSpeech.timer);if("speechSynthesis" in window)window.speechSynthesis.cancel();syncAudioButton(true);if(announceState)announce(document.documentElement.lang==="ar"?"تم إيقاف القراءة التلقائية.":"Automatic audio is off.");return}if("speechSynthesis" in window)window.speechSynthesis.resume();syncAudioButton(false);if(announceState)announce(document.documentElement.lang==="ar"?"تم تفعيل القراءة التلقائية.":"Automatic audio is on.");speakCurrent?speakText(words[currentIndex].en):scheduleWordSpeech()}function speakText(text){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=.8;window.speechSynthesis.speak(utterance)}function scheduleWordSpeech(){clearTimeout(scheduleWordSpeech.timer);const scheduledIndex=currentIndex;scheduleWordSpeech.timer=setTimeout(()=>{if(automaticAudioEnabled&&scheduledIndex===currentIndex&&!card.classList.contains("flipped"))speakText(words[currentIndex].en)},900)}function scheduleExampleSpeech(){clearTimeout(scheduleWordSpeech.timer);const scheduledIndex=currentIndex;scheduleWordSpeech.timer=setTimeout(()=>{if(automaticAudioEnabled&&scheduledIndex===currentIndex&&card.classList.contains("flipped")&&words[currentIndex].ex_en)speakText(words[currentIndex].ex_en)},900)}function updateCard(){const item=words[currentIndex];card.classList.remove("flipped");const front=document.getElementById("cardFront");const back=document.getElementById("cardBack");front.setAttribute("aria-hidden","false");back.setAttribute("aria-hidden","true");front.inert=false;back.inert=true;document.getElementById("ttsBtn").disabled=false;const flip=document.getElementById("flipButton");flip.textContent="Show answe ped?"Show word":"Show answer";flip.setAttribute("aria-pressed",String(isFlipped));announce(isFlipped?"Answer shown.":"Word shown.");isFlipped?scheduleExampleSpeech():scheduleWordSpeech()}function nextCard(){currentIndex=(currentIndex+1)%words.length;updateCard()}function prevCard(){currentIndex=(currentIndex-1+words.length)%words.length;updateCard()}card.addEventListener("click",event=>{if(didSwipe){didSwipe=false;event.preventDefault();return}toggleCard(event)});card.addEventListener("touchstart",event=>{touchStartX=event.changedTouches[0].screenX;touchEndX=touchStartX;didSwipe=false},{passive:true});card.addEventListener("touchend",event=>{touchEndX=event.changedTouches[0].screenX;const distance=touchEndX-touchStartX;if(Math.abs(distance)>50){didSwipe=true;distance<0?nextCard():prevCard();setTimeout(()=>{didSwipe=false},400)}},{passive:true});document.getElementById("previous").addEventListener("click",prevCard);document.getElementById("next").addEventListener("click",nextCard);document.getElementById("flipButton").addEventListener("click",toggleCard);document.getElementById("exampleAudio").addEventListener("click",event=>{event.stopPropagation();speakText(words[currentIndex].ex_en)});document.getElementById("ttsBtn").addEventListener("click",event=>{event.stopPropagation();speakText(words[currentIndex].en)});document.getElementById("audioStart").addEventListener("click",event=>{event.stopPropagation();setAutomaticAudioEnabled(!automaticAudioEnabled,true,false)});document.addEventListener("keydown",event=>{if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==="ArrowRight"){event.preventDefault();nextCard()}if(event.key==="ArrowLeft"){event.preventDefault();prevCard()}});syncAudioButton(!automaticAudioEnabled);updateCard();</script><script>window.EFN_PAGE_WORDS=words;</script><script src="../learning-loop.js?v=20260825-stage8"></script><script src="../practice-session.js?v=20260825-stage8"></script><script src="../practice-pane
