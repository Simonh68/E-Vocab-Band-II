mean_he":"רישיון נהיגה","synonyms":[],"ex_en":"He got his driving license yesterday.","ex_he":"הוא קיבל את רישיון הנהיגה שלו אתמול.","family_members":[]},{"serial":1260,"en":"by accident","pos":"Phrase","mean_he":"במקרה","synonyms":[],"ex_en":"I found the book by accident too.","ex_he":"גם מצאתי את הספר במקרה.","family_members":[]},{"serial":1306,"en":"chemistry","pos":"Noun","mean_he":"כימיה","synonyms":[],"ex_en":"Chemistry can be really complex.","ex_he":"כימיה יכולה להיות מסובכת מאוד.","family_members":[]},{"serial":1253,"en":"builder","pos":"Noun","mean_he":"בנאי","synonyms":[],"ex_en":"The builder repaired the wall.","ex_he":"הבנאי תיקן את הקיר.","family_members":[]},{"serial":1903,"en":"record","pos":"Noun","mean_he":"רשומה; תיעוד; שיא","synonyms":["best, biggest etc."],"ex_en":"That is likely a new record.","ex_he":"זה כנראה שיא חדש.","family_members":[]},{"serial":1446,"en":"downtown","pos":"Adjective","mean_he":"במרכז העיר","synonyms":[],"ex_en":"We stayed at a downtown hotel.","ex_he":"שהינו במלון במרכז העיר.","family_members":[]},{"serial":1525,"en":"feel like doing something","pos":"Phrase","mean_he":"להתחשק לעשות משהו","synonyms":[],"ex_en":"I do not feel like doing it.","ex_he":"אין לי חשק לעשות את זה.","family_members":[]},{"serial":1842,"en":"pie","pos":"Noun","mean_he":"עוגה","synonyms":[],"ex_en":"Our pie was delicious.","ex_he":"העוגה שלנו הייתה טעימה.","family_members":[]},{"serial":1468,"en":"electronic","pos":"Adjective","mean_he":"אלקטרוני","synonyms":[],"ex_en":"I sent an electronic message.","ex_he":"שלחתי הודעה אלקטרונית.","family_members":[]},{"serial":1827,"en":"pay","pos":"Verb","mean_he":"לשלם","synonyms":["salary"],"ex_en":"I will have to pay for it.","ex_he":"אני צריך לשלם עבור זה.","family_members":[{"word":"payment","pos":""}]},{"serial":2164,"en":"wonder","pos":"Verb","mean_he":"לתהות","synonyms":["polite request"],"ex_en":"I wonder where she is.","ex_he":"אני תוהה איפה היא.","family_members":[]},{"serial":1445,"en":"download","po hrase","mean_he":"מקווה לעשות משהו","synonyms":[],"ex_en":"I hope I will be able to do that.","ex_he":"אני מקווה שאוכל לעשות את זה.","family_members":[]},{"serial":1804,"en":"originally","pos":"Adverb","mean_he":"במקור","synonyms":[],"ex_en":"That bridge was originally a toll bridge.","ex_he":"הגשר הזה היה במקור גשר בתשלום.","family_members":[]},{"serial":1122,"en":"alphabetical","pos":"Adjective","mean_he":"אלפביתי","synonyms":[],"ex_en":"Please put the words in alphabetical order.","ex_he":"בבקשה, סדר את המילים בסדר אלפביתי.","family_members":[{"word":"alphabetically","pos":"Adverb"}]},{"serial":1958,"en":"set the table","pos":"Phrase","mean_he":"לערוך את השולחן","synonyms":[],"ex_en":"I am going to set the table.","ex_he":"אני עומד לערוך את השולחן.","family_members":[]},{"serial":1735,"en":"master","pos":"Noun","mean_he":"מאסטר","synonyms":[],"ex_en":"He is a chess master.","ex_he":"הוא רב־אמן בשחמט.","family_members":[]},{"serial":1374,"en":"course","pos":"Noun","mean_he":"קורס","synonyms":["part of a meal"],"ex_en":"That course teaches basic skills in first aid.","ex_he":"הקורס הזה מדריך בכישורים בסיסיים של עזרה ראשונה.","family_members":[]},{"serial":1416,"en":"design","pos":"Noun","mean_he":"תָּכְנִית; תִּכְנוּן; עִצּוּב","synonyms":["planning, plan"],"ex_en":"This design does not suit my taste.","ex_he":"התכנון הזה לא מוצא חן בעיני.","family_members":[{"word":"designer","pos":"Noun"}]},{"serial":1418,"en":"desire","pos":"Noun","mean_he":"רצון","synonyms":[],"ex_en":"Her greatest desire is to travel.","ex_he":"הרצון הגדול שלה הוא לטייל.","family_members":[]},{"serial":1865,"en":"post","pos":"Verb","mean_he":"לפרסם","synonyms":["Internet (website or social media)"],"ex_en":"Please post the news online.","ex_he":"פרסם בבקשה את החדשות ברשת.","family_members":[]},{"serial":1654,"en":"in particular","pos":"Phrase","mean_he":"במיוחד","synonyms":[],"ex_en":"I am not in any particular hurry.","ex_he":"אני לא נחפז במיוחד.","family_members":[]},{"serial":2038,"en":"swa
