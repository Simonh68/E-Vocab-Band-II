<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#102f4a;background:#0d2742}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 15%,#1b5273 0,#0d2742 45%,#091a2c 100%)}
main{width:min(720px,100%);background:#f8fafc;border-radius:28px;padding:clamp(24px,5vw,44px);box-shadow:0 24px 70px rgba(0,0,0,.32);text-align:center}
.brand{font-weight:900;letter-spacing:.04em;color:#34546e;margin-bottom:12px}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;margin:.15em 0 .35em}
p{font-size:1.08rem;line-height:1.65;color:#526778;margin:0 auto 24px;max-width:560px}
.levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 28px}
.levels span{padding:9px 14px;border-radius:999px;color:#fff;font-weight:900}
.core1{background:#176b8a}.core2{background:#6d38a8}.band3{background:#27734c}
.actions{display:flex;gap:10px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.open,.copy{min-height:54px;border-radius:14px;font:inherit;font-weight:900;cursor:pointer}
.open{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;background:#0e3151;color:#fff;text-decoration:none;border:2px solid #0e3151;flex:1 1 260px}
.copy{width:58px;border:2px solid #0e3151;background:#fff;color:#0e3151;font-size:1.35rem}
.copy:focus-visible,.open:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
.note{margin-top:18px;font-size:.9rem;color:#667788}
.toast{min-height:24px;margin-top:10px;font-weight:800;color:#27734c}
@media(max-width:480px){.actions{display:grid;grid-template-columns:1fr 58px}.open{min-width:0}.copy{width:58px}}
</style>
</head>
<body>
<main>
<div class="brand">ENGLISH FOR NOAR</div>
<h1>דוח ההתקדמות שלי</h1>
<p>כאן תוכלו לראות במקום אחד את ההתקדמות שלכם באוצר המילים. הדוח קורא רק מידע שנשמר במכשיר שבו תרגלתם.</p>
<div class="levels" aria-label="חלקי הדוח">
<span class="core1">CORE I</span>
<span class="core2">CORE II</span>
<span class="band3">BAND III</span>
</div>
<div class="actions">
<a class="open" href="../progress-report.html">📊 פתחו את דוח ההתקדמות</a>
<button class="copy" type="button" id="copyLink" aria-label="העתקת קישור לדוח" title="העתקת קישור">🔗</button>
</div>
<div class="toast" id="copyStatus" role="status" aria-live="polite"></div>
<div class="note">אין צורך בשם משתמש. ההתקדמות נשארת במכשיר והשיתוף נעשה רק ביוזמתכם.</div>
</main>
<script>
(() => {
  const SHARE_URL='https://simonh68.github.io/E-Vocab-Band-II/my-progress/';
  const button=document.getElementById('copyLink');
  const status=document.getElementById('copyStatus');
  async function copy(){
    try{
      if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(SHARE_URL);
      else{
        const t=document.createElement('textarea'); t.value=SHARE_URL; t.style.position='fixed'; t.style.opacity='0';
        document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
      }
      status.textContent='הקישור הועתק ✓';
      setTimeout(()=>status.textContent='',2200);
    }catch{
      status.textContent='לא ניתן להעתיק אוטומטית. לחיצה ארוכה על הכתובת בדפדפן תאפשר העתקה.';
    }
  }
  button.addEventListener('click',copy);
})();
</script>
</body>
</html>
