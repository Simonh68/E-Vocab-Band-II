<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Progress bridge</title></head><body><script>(()=>{const ALLOWED=['https://englishfornoar.co.il','https://www.englishfornoar.co.il'];const keys=['efn.band2.core1.progress.v1','efn.vocab.progress.v1','efn.band2.local-progress-consent.v1'];const read=()=>Object.fromEntries(keys.map(k=>[k,(()=>{try{return localStorage.getItem(k)}catch{return null}})()]));function write(data){if(!data||typeof data!=='object')return false;try{for(const k of keys){if(Object.prototype.hasOwnProperty.call(data,k)){const v=data[k];if(v===null||v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,String(v));}}return true}catch{return false}}window.addEventListener('message',e=>{if(!ALLOWED.includes(e.origin)||!e.data||e.data.source!=='efn-progress-hub')return;if(e.data.type==='request-export')e.source?.postMessage({source:'efn-progress-bridge',site:'band2',type:'export',requestId:e.data.requestId,data:read()},e.origin);if(e.data.type==='import'){const ok=write(e.data.data);e.source?.postMessage({source:'efn-progress-bridge',site:'band2',type:'import-result',requestId:e.data.requestId,ok},e.origin);}});parent!==window&&parent.postMessage({source:'efn-progress-bridge',site:'band2',type:'ready'},'*');})();</script></body></html>
